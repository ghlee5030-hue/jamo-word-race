<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>테스트 우주</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f7f3ff;
      --ink: #17151f;
      --muted: #7b7688;
      --line: #e8e1f6;
      --card: #ffffff;
      --lav: #8c7cff;
      --pink: #ff83b7;
      --blue: #68b8ff;
      --mint: #72debd;
      --yellow: #ffe071;
      --shadow: 0 16px 44px rgba(83, 72, 134, 0.14);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      color: var(--ink);
      background:
        radial-gradient(circle at 10% 8%, rgba(255, 131, 183, 0.2), transparent 25%),
        radial-gradient(circle at 92% 18%, rgba(104, 184, 255, 0.22), transparent 25%),
        linear-gradient(180deg, #fff9fd 0%, var(--bg) 44%, #eef8ff 100%);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    button,
    input {
      font: inherit;
    }

    button {
      -webkit-tap-highlight-color: transparent;
    }

    .page {
      width: min(100%, 480px);
      min-height: 100vh;
      margin: 0 auto;
      padding: 14px 14px 24px;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 5;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin: -14px -14px 0;
      padding: 14px;
      border-bottom: 1px solid rgba(232, 225, 246, 0.72);
      background: rgba(255, 249, 253, 0.86);
      backdrop-filter: blur(14px);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      font-weight: 950;
    }

    .brand-mark {
      display: grid;
      place-items: center;
      width: 32px;
      height: 32px;
      border-radius: 8px;
      color: white;
      background: linear-gradient(135deg, var(--lav), var(--pink));
      box-shadow: 0 10px 24px rgba(140, 124, 255, 0.28);
    }

    .ghost {
      min-height: 34px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 0 11px;
      color: #4d4662;
      background: rgba(255, 255, 255, 0.75);
      cursor: pointer;
      font-size: 13px;
      font-weight: 850;
    }

    .screen {
      display: none;
      animation: rise 220ms ease both;
    }

    .screen.active {
      display: block;
    }

    .hero {
      display: grid;
      gap: 12px;
      padding: 22px 4px 8px;
      text-align: center;
    }

    .tag-row,
    .traits {
      display: flex;
      gap: 7px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .tag,
    .trait {
      display: inline-flex;
      align-items: center;
      min-height: 30px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 0 10px;
      color: #655d78;
      background: rgba(255, 255, 255, 0.84);
      font-size: 13px;
      font-weight: 850;
    }

    h1,
    h2,
    p {
      margin: 0;
    }

    h1 {
      font-size: 40px;
      line-height: 1.02;
      letter-spacing: 0;
      word-break: keep-all;
    }

    .lead {
      color: var(--muted);
      line-height: 1.58;
      word-break: keep-all;
    }

    .section-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin: 22px 0 10px;
      font-size: 18px;
      font-weight: 950;
    }

    .test-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .ad-slot {
      display: grid;
      justify-items: center;
      gap: 6px;
      width: min(100%, 360px);
      margin: 16px auto 4px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 850;
    }

    .test-card {
      overflow: hidden;
      min-height: 246px;
      border: 1px solid rgba(255, 255, 255, 0.9);
      border-radius: 8px;
      background: var(--card);
      box-shadow: var(--shadow);
      cursor: pointer;
      text-align: left;
      padding: 0;
    }

    .thumb {
      position: relative;
      height: 148px;
      overflow: hidden;
      background: var(--cover);
    }

    .thumb::before {
      content: "";
      position: absolute;
      left: 50%;
      bottom: -42px;
      width: 210px;
      height: 88px;
      transform: translateX(-50%) rotate(-5deg);
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.55);
      background: rgba(255, 255, 255, 0.32);
    }

    .face {
      position: absolute;
      left: 50%;
      bottom: 24px;
      width: 92px;
      height: 92px;
      transform: translateX(-50%);
      border-radius: 48% 52% 46% 54%;
      background:
        radial-gradient(circle at 37% 40%, #17151f 0 4px, transparent 5px),
        radial-gradient(circle at 63% 40%, #17151f 0 4px, transparent 5px),
        radial-gradient(ellipse at 50% 64%, var(--cheek) 0 10px, transparent 11px),
        linear-gradient(145deg, #fffaf0 0%, #ffffff 48%, rgba(255, 255, 255, 0.48) 100%);
      box-shadow: 0 14px 34px rgba(83, 72, 134, 0.18);
    }

    .floating {
      position: absolute;
      display: grid;
      place-items: center;
      width: 44px;
      height: 30px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.76);
      color: #62577b;
      font-size: 11px;
      font-weight: 950;
      box-shadow: 0 8px 22px rgba(83, 72, 134, 0.12);
    }

    .floating.a {
      left: 12px;
      top: 16px;
      transform: rotate(-8deg);
    }

    .floating.b {
      right: 12px;
      bottom: 22px;
      transform: rotate(8deg);
    }

    .card-body {
      display: grid;
      gap: 5px;
      padding: 10px;
    }

    .card-body strong {
      font-size: 16px;
      line-height: 1.28;
      word-break: keep-all;
    }

    .card-body span {
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
    }

    .name-card,
    .quiz-card,
    .result-card {
      margin-top: 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.93);
      box-shadow: var(--shadow);
    }

    .selected-cover {
      position: relative;
      overflow: hidden;
      min-height: 310px;
      margin-top: 14px;
      border-radius: 8px;
      background: var(--cover);
      box-shadow: var(--shadow);
    }

    .selected-cover .face {
      width: 154px;
      height: 154px;
      bottom: 48px;
    }

    .selected-cover .floating {
      width: 70px;
      height: 44px;
      font-size: 14px;
    }

    .selected-cover .floating.a {
      left: 24px;
      top: 42px;
    }

    .selected-cover .floating.b {
      right: 28px;
      bottom: 78px;
    }

    .name-card {
      display: grid;
      gap: 10px;
      padding: 14px;
    }

    .name-card input {
      width: 100%;
      height: 48px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 0 14px;
      outline: 0;
      background: #fbfaff;
      color: var(--ink);
      font-weight: 850;
    }

    .primary {
      min-height: 50px;
      border: 0;
      border-radius: 8px;
      padding: 0 16px;
      color: white;
      background: linear-gradient(135deg, var(--lav), #ff6faa);
      box-shadow: 0 12px 28px rgba(140, 124, 255, 0.26);
      cursor: pointer;
      font-weight: 950;
    }

    .quiz-card {
      display: grid;
      gap: 18px;
      padding: 18px;
    }

    .progress-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 900;
    }

    .progress {
      height: 9px;
      overflow: hidden;
      border-radius: 8px;
      background: #eee9fa;
    }

    .bar {
      width: 0%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--lav), var(--pink), var(--blue));
      transition: width 220ms ease;
    }

    .question {
      font-size: 27px;
      line-height: 1.16;
      letter-spacing: 0;
      word-break: keep-all;
    }

    .answers {
      display: grid;
      gap: 10px;
    }

    .answer {
      width: 100%;
      min-height: 64px;
      border: 1px solid #e9e2f5;
      border-radius: 8px;
      padding: 14px;
      color: #2f2a3d;
      background: #ffffff;
      text-align: left;
      cursor: pointer;
      font-weight: 850;
      line-height: 1.45;
      box-shadow: 0 8px 20px rgba(83, 72, 134, 0.07);
    }

    .result-card {
      display: grid;
      gap: 13px;
      padding: 18px;
      text-align: center;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 34px;
      width: fit-content;
      margin: 0 auto;
      border-radius: 8px;
      padding: 0 12px;
      color: #655d78;
      background: #f6f2ff;
      font-weight: 950;
    }

    .result-card h2 {
      font-size: 34px;
      line-height: 1.08;
      letter-spacing: 0;
      word-break: keep-all;
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 4px;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 18px;
      z-index: 20;
      min-height: 38px;
      border-radius: 8px;
      padding: 9px 14px;
      color: white;
      background: #17151f;
      font-weight: 900;
      opacity: 0;
      transform: translateX(-50%) translateY(12px);
      transition: opacity 160ms ease, transform 160ms ease;
      pointer-events: none;
      white-space: nowrap;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    @keyframes rise {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 370px) {
      .test-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark">T</div>
        <span>테스트 우주</span>
      </div>
      <button class="ghost" id="wordGameButton">낱자 게임</button>
    </header>

    <section class="screen active" id="homeScreen">
      <div class="hero">
        <div class="tag-row">
          <span class="tag">심리테스트</span>
          <span class="tag">친구 공유</span>
          <span class="tag">짧고 귀엽게</span>
        </div>
        <h1>오늘은 어떤 테스트 해볼까?</h1>
        <p class="lead">가볍게 고르고, 빠르게 결과를 보고, 친구들이랑 비교해보세요.</p>
      </div>
      <div class="section-title">
        <span>인기 테스트</span>
        <span class="tag" id="testCount">0개</span>
      </div>
      <div class="test-grid" id="testGrid"></div>
      <div class="ad-slot" aria-label="광고">
        <span>광고</span>
        <ins class="kakao_ad_area" style="display:none;"
          data-ad-unit="DAN-IyjFMMsX8A0cddwc"
          data-ad-width="320"
          data-ad-height="100"></ins>
      </div>
    </section>

    <section class="screen" id="startScreen">
      <div class="selected-cover" id="selectedCover" aria-hidden="true">
        <div class="floating a" id="coverWordA">LOVE</div>
        <div class="floating b" id="coverWordB">MOOD</div>
        <div class="face"></div>
      </div>
      <div class="hero">
        <div class="tag-row" id="selectedTags"></div>
        <h1 id="selectedTitle"></h1>
        <p class="lead" id="selectedDescription"></p>
      </div>
      <div class="name-card">
        <input id="nameInput" maxlength="14" placeholder="닉네임을 입력하세요">
        <button class="primary" id="startButton">테스트 시작하기</button>
      </div>
    </section>

    <section class="screen" id="quizScreen">
      <div class="quiz-card">
        <div class="progress-meta">
          <span id="stepText">1 / 8</span>
          <span id="nameText">손님</span>
        </div>
        <div class="progress"><div class="bar" id="progressBar"></div></div>
        <h2 class="question" id="questionText"></h2>
        <div class="answers" id="answers"></div>
      </div>
    </section>

    <section class="screen" id="resultScreen">
      <div class="selected-cover" id="resultCover" aria-hidden="true">
        <div class="floating a">RESULT</div>
        <div class="floating b">TYPE</div>
        <div class="face"></div>
      </div>
      <div class="result-card">
        <div class="badge" id="resultCode">TYPE</div>
        <h2 id="resultTitle"></h2>
        <p class="lead" id="resultDescription"></p>
        <div class="traits" id="traits"></div>
        <div class="actions">
          <button class="primary" id="shareButton">결과 복사</button>
          <button class="ghost" id="restartButton">다른 테스트</button>
        </div>
      </div>
    </section>
  </main>

  <div class="toast" id="toast"></div>

  <script async type="text/javascript" src="https://t1.kakaocdn.net/kas/static/ba.min.js"></script>
  <script>
    const baseQuestions = [

    const testData = [

      {

      progressBar.style.width = `${(state.index / state.test.questions.length) * 100}%`;
      questionText.textContent = question.text;
      answersEl.innerHTML = "";
      question.answers.forEach((answer) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "answer";
        button.textContent = answer.text;
        button.addEventListener("click", () => choose(answer));
        answersEl.append(button);
      });
    }

    function choose(answer) {
      Object.entries(answer.scores).forEach(([key, value]) => {
        state.scores[key] = (state.scores[key] || 0) + value;
      });
      state.index += 1;
      if (state.index >= state.test.questions.length) {
        progressBar.style.width = "100%";
        finish();
      } else {
        renderQuestion();
      }
    }

    function finish() {
      const winner = Object.keys(state.test.results).sort((a, b) => (state.scores[b] || 0) - (state.scores[a] || 0))[0] || Object.keys(state.test.results)[0];
      const [title, desc, tags] = state.test.results[winner];
      state.result = { code: winner.toUpperCase(), title, desc, tags };
      resultCode.textContent = `${state.name} · ${state.result.code}`;
      resultTitle.textContent = state.result.title;
      resultDescription.textContent = state.result.desc;
      traits.innerHTML = state.result.tags.map((trait) => `<span class="trait">${trait}</span>`).join("");
      show("result");
    }

    function restart() {
      show("home");
    }

    async function share() {
      if (!state.result) return;
      const text = `${state.name}님의 ${state.test.title} 결과는 ${state.result.title}\n${state.result.desc}\n${location.href}`;
      try {
        await navigator.clipboard.writeText(text);
        showToast("결과를 복사했어요");
      } catch {
        showToast("복사 권한이 필요해요");
      }
    }

    function showToast(message) {
      toast.textContent = message;
      toast.classList.add("show");
      window.clearTimeout(showToast.timer);
      showToast.timer = window.setTimeout(() => toast.classList.remove("show"), 1100);
    }

    startButton.addEventListener("click", start);
    nameInput.addEventListener("keydown", (event) => {
      if (event.key === "Enter") start();
    });
    restartButton.addEventListener("click", restart);
    shareButton.addEventListener("click", share);
    wordGameButton.addEventListener("click", () => {
      window.location.href = "index.html";
    });

    renderHome();
  </script>
</body>
</html>
