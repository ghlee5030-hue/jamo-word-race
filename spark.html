<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>반짝 채집</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #f7fbff;
      --muted: #aab6c4;
      --panel: rgba(10, 18, 28, 0.72);
      --line: rgba(255, 255, 255, 0.14);
      --cyan: #39d0ff;
      --gold: #ffd166;
      --coral: #ff6b6b;
      --mint: #64e6a5;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 18% 22%, rgba(57, 208, 255, 0.18), transparent 28%),
        radial-gradient(circle at 80% 12%, rgba(255, 209, 102, 0.14), transparent 24%),
        linear-gradient(160deg, #08101c 0%, #101724 48%, #07130f 100%);
      color: var(--ink);
      user-select: none;
      touch-action: none;
    }

    .game {
      position: relative;
      width: 100vw;
      height: 100vh;
      min-height: 540px;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    .hud {
      position: absolute;
      inset: 18px 18px auto 18px;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
      pointer-events: none;
    }

    .metric,
    .overlay,
    .footer {
      border: 1px solid var(--line);
      background: var(--panel);
      backdrop-filter: blur(18px);
      box-shadow: 0 18px 70px rgba(0, 0, 0, 0.28);
    }

    .metric {
      min-width: 0;
      border-radius: 8px;
      padding: 12px 14px;
    }

    .label {
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0;
      text-transform: uppercase;
    }

    .value {
      margin-top: 3px;
      font-size: clamp(22px, 4vw, 34px);
      font-weight: 850;
      line-height: 1;
      white-space: nowrap;
    }

    .overlay {
      position: absolute;
      left: 50%;
      top: 50%;
      width: min(92vw, 520px);
      transform: translate(-50%, -50%);
      border-radius: 8px;
      padding: 28px;
      text-align: center;
    }

    .overlay[hidden] {
      display: none;
    }

    h1 {
      margin: 0;
      font-size: clamp(40px, 9vw, 72px);
      line-height: 0.95;
      letter-spacing: 0;
    }

    .subtitle {
      margin: 16px auto 22px;
      max-width: 34rem;
      color: #d5dde8;
      line-height: 1.55;
      word-break: keep-all;
    }

    .button-row {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    button {
      min-height: 44px;
      border: 0;
      border-radius: 8px;
      padding: 0 18px;
      font: inherit;
      font-weight: 800;
      color: #06111a;
      background: var(--gold);
      cursor: pointer;
      box-shadow: 0 10px 32px rgba(255, 209, 102, 0.25);
    }

    button.secondary {
      color: var(--ink);
      background: rgba(255, 255, 255, 0.12);
      box-shadow: none;
      border: 1px solid var(--line);
    }

    .footer {
      position: absolute;
      left: 18px;
      right: 18px;
      bottom: 18px;
      border-radius: 8px;
      padding: 10px 14px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.4;
      pointer-events: none;
      text-align: center;
    }

    .toast {
      position: absolute;
      left: 50%;
      top: 112px;
      transform: translateX(-50%);
      color: var(--mint);
      font-weight: 850;
      opacity: 0;
      transition: opacity 160ms ease, transform 160ms ease;
      pointer-events: none;
      text-shadow: 0 0 18px rgba(100, 230, 165, 0.55);
    }

    .toast.show {
      opacity: 1;
      transform: translate(-50%, -8px);
    }

    @media (max-width: 680px) {
      .game {
        min-height: 100vh;
      }

      .hud {
        inset: 10px 10px auto 10px;
        gap: 7px;
      }

      .metric {
        padding: 9px 10px;
      }

      .label {
        font-size: 10px;
      }

      .value {
        font-size: 22px;
      }

      .overlay {
        padding: 22px 18px;
      }

      .footer {
        left: 10px;
        right: 10px;
        bottom: 10px;
        font-size: 12px;
      }
    }
  </style>
</head>
<body>
  <main class="game" aria-label="반짝 채집 게임">
    <canvas id="gameCanvas"></canvas>

    <section class="hud" aria-live="polite">
      <div class="metric">
        <div class="label">점수</div>
        <div class="value" id="score">0</div>
      </div>
      <div class="metric">
        <div class="label">콤보</div>
        <div class="value" id="combo">x1</div>
      </div>
      <div class="metric">
        <div class="label">남은 시간</div>
        <div class="value" id="time">45</div>
      </div>
    </section>

    <div class="toast" id="toast">피버!</div>

    <section class="overlay" id="menu">
      <h1>반짝 채집</h1>
      <p class="subtitle">
        빛나는 조각을 모으고 붉은 파편은 피해요. 연속으로 먹으면 콤보가 붙고, 초록 구슬은 잠깐 무적입니다.
      </p>
      <div class="button-row">
        <button id="startButton">시작</button>
        <button class="secondary" id="practiceButton">연습 모드</button>
      </div>
    </section>

    <section class="overlay" id="result" hidden>
      <h1 id="resultTitle">끝!</h1>
      <p class="subtitle" id="resultText"></p>
      <div class="button-row">
        <button id="restartButton">다시 하기</button>
      </div>
    </section>

    <div class="footer">
      WASD/방향키, 마우스, 터치로 이동 · Space로 시작/재시작
    </div>
  </main>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    const scoreEl = document.getElementById("score");
    const comboEl = document.getElementById("combo");
    const timeEl = document.getElementById("time");
    const menuEl = document.getElementById("menu");
    const resultEl = document.getElementById("result");
    const resultTitleEl = document.getElementById("resultTitle");
    const resultTextEl = document.getElementById("resultText");
    const toastEl = document.getElementById("toast");
    const startButton = document.getElementById("startButton");
    const practiceButton = document.getElementById("practiceButton");
    const restartButton = document.getElementById("restartButton");

    const state = {
      mode: "menu",
      practice: false,
      width: 0,
      height: 0,
      dpr: 1,
      lastTime: 0,
      score: 0,
      combo: 1,
      comboTimer: 0,
      timeLeft: 45,
      fever: 0,
      spawnGem: 0,
      spawnHazard: 0,
      spawnShield: 7,
      shake: 0,
      pointer: null,
      keys: new Set(),
      gems: [],
      hazards: [],
      shields: [],
      particles: [],
      stars: [],
      player: { x: 0, y: 0, r: 18, vx: 0, vy: 0 }
    };

    const clamp = (value, min, max) => Math.max(min, Math.min(max, value));
    const rand = (min, max) => Math.random() * (max - min) + min;
    const distance = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);

    function resize() {
      state.dpr = Math.min(window.devicePixelRatio || 1, 2);
      state.width = window.innerWidth;
      state.height = window.innerHeight;
      canvas.width = Math.floor(state.width * state.dpr);
      canvas.height = Math.floor(state.height * state.dpr);
      canvas.style.width = `${state.width}px`;
      canvas.style.height = `${state.height}px`;
      ctx.setTransform(state.dpr, 0, 0, state.dpr, 0, 0);

      state.player.x = clamp(state.player.x || state.width / 2, 24, state.width - 24);
      state.player.y = clamp(state.player.y || state.height * 0.7, 92, state.height - 70);
      makeStars();
    }

    function makeStars() {
      const count = Math.floor((state.width * state.height) / 15000);
      state.stars = Array.from({ length: count }, () => ({
        x: rand(0, state.width),
        y: rand(0, state.height),
        r: rand(0.7, 2.3),
        a: rand(0.16, 0.65),
        drift: rand(8, 24)
      }));
    }

    function reset(practice = false) {
      state.mode = "play";
      state.practice = practice;
      state.score = 0;
      state.combo = 1;
      state.comboTimer = 0;
      state.timeLeft = practice ? 999 : 45;
      state.fever = 0;
      state.spawnGem = 0;
      state.spawnHazard = 0;
      state.spawnShield = 6;
      state.shake = 0;
      state.gems = [];
      state.hazards = [];
      state.shields = [];
      state.particles = [];
      state.player.x = state.width / 2;
      state.player.y = state.height * 0.72;
      state.player.vx = 0;
      state.player.vy = 0;
      menuEl.hidden = true;
      resultEl.hidden = true;
      updateHud();
    }

    function finish() {
      state.mode = "result";
      resultTitleEl.textContent = state.score >= 700 ? "대박!" : state.score >= 350 ? "괜찮은데요!" : "끝!";
      resultTextEl.textContent = `최종 점수 ${state.score}점. 최고 콤보는 x${Math.max(1, state.combo)} 근처까지 갔어요.`;
      resultEl.hidden = false;
    }

    function updateHud() {
      scoreEl.textContent = Math.floor(state.score);
      comboEl.textContent = `x${state.combo}`;
      timeEl.textContent = state.practice ? "--" : Math.max(0, Math.ceil(state.timeLeft));
    }

    function showToast(text) {
      toastEl.textContent = text;
      toastEl.classList.add("show");
      window.clearTimeout(showToast.timer);
      showToast.timer = window.setTimeout(() => toastEl.classList.remove("show"), 620);
    }

    function spawnGem() {
      state.gems.push({
        x: rand(28, state.width - 28),
        y: rand(105, state.height - 52),
        r: rand(9, 14),
        spin: rand(0, Math.PI),
        life: rand(5.5, 7.5)
      });
    }

    function spawnShield() {
      state.shields.push({
        x: rand(32, state.width - 32),
        y: rand(115, state.height - 60),
        r: 13,
        life: 6
      });
    }

    function spawnHazard() {
      const side = Math.floor(rand(0, 4));
      const speed = rand(92, 170) + Math.min(110, state.score / 8);
      const item = { x: 0, y: 0, vx: 0, vy: 0, r: rand(12, 20), spin: rand(0, 7) };
      if (side === 0) {
        item.x = rand(0, state.width);
        item.y = -30;
        item.vx = rand(-35, 35);
        item.vy = speed;
      } else if (side === 1) {
        item.x = state.width + 30;
        item.y = rand(90, state.height);
        item.vx = -speed;
        item.vy = rand(-35, 35);
      } else if (side === 2) {
        item.x = rand(0, state.width);
        item.y = state.height + 30;
        item.vx = rand(-35, 35);
        item.vy = -speed;
      } else {
        item.x = -30;
        item.y = rand(90, state.height);
        item.vx = speed;
        item.vy = rand(-35, 35);
      }
      state.hazards.push(item);
    }

    function burst(x, y, color, count = 12) {
      for (let i = 0; i < count; i += 1) {
        const angle = rand(0, Math.PI * 2);
        const speed = rand(60, 210);
        state.particles.push({
          x,
          y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          r: rand(1.6, 4.2),
          color,
          life: rand(0.35, 0.82),
          max: 0.82
        });
      }
    }

    function collectGem(index) {
      const gem = state.gems[index];
      state.gems.splice(index, 1);
      state.combo = clamp(state.combo + 1, 1, 12);
      state.comboTimer = 2.25;
      state.score += 10 * state.combo;
      if (state.combo === 5 || state.combo === 10) showToast(`콤보 x${state.combo}`);
      burst(gem.x, gem.y, "#ffd166", 16);
      updateHud();
    }

    function collectShield(index) {
      const shield = state.shields[index];
      state.shields.splice(index, 1);
      state.fever = 4.2;
      state.score += 35;
      showToast("무적!");
      burst(shield.x, shield.y, "#64e6a5", 22);
      updateHud();
    }

    function hitHazard(index) {
      const hazard = state.hazards[index];
      state.hazards.splice(index, 1);
      if (state.fever > 0) {
        state.score += 18;
        burst(hazard.x, hazard.y, "#39d0ff", 18);
      } else {
        state.score = Math.max(0, state.score - 45);
        state.combo = 1;
        state.comboTimer = 0;
        state.shake = 0.3;
        burst(hazard.x, hazard.y, "#ff6b6b", 20);
      }
      updateHud();
    }

    function update(dt) {
      if (state.mode !== "play") return;

      if (!state.practice) {
        state.timeLeft -= dt;
        if (state.timeLeft <= 0) {
          state.timeLeft = 0;
          updateHud();
          finish();
          return;
        }
      }

      state.spawnGem -= dt;
      state.spawnHazard -= dt;
      state.spawnShield -= dt;
      state.comboTimer -= dt;
      state.fever -= dt;
      state.shake = Math.max(0, state.shake - dt);

      if (state.comboTimer <= 0 && state.combo > 1) {
        state.combo = 1;
        updateHud();
      }

      if (state.spawnGem <= 0) {
        spawnGem();
        state.spawnGem = rand(0.34, 0.72);
      }

      if (state.spawnHazard <= 0) {
        spawnHazard();
        state.spawnHazard = rand(0.48, 0.94) * Math.max(0.52, 1 - state.score / 2200);
      }

      if (state.spawnShield <= 0) {
        spawnShield();
        state.spawnShield = rand(8, 12);
      }

      movePlayer(dt);
      updateItems(dt);
      updateParticles(dt);
      updateHud();
    }

    function movePlayer(dt) {
      const p = state.player;
      let ax = 0;
      let ay = 0;
      if (state.keys.has("ArrowLeft") || state.keys.has("KeyA")) ax -= 1;
      if (state.keys.has("ArrowRight") || state.keys.has("KeyD")) ax += 1;
      if (state.keys.has("ArrowUp") || state.keys.has("KeyW")) ay -= 1;
      if (state.keys.has("ArrowDown") || state.keys.has("KeyS")) ay += 1;

      if (state.pointer) {
        const dx = state.pointer.x - p.x;
        const dy = state.pointer.y - p.y;
        p.vx += dx * 18 * dt;
        p.vy += dy * 18 * dt;
      }

      if (ax || ay) {
        const len = Math.hypot(ax, ay) || 1;
        p.vx += (ax / len) * 980 * dt;
        p.vy += (ay / len) * 980 * dt;
      }

      p.vx *= Math.pow(0.0008, dt);
      p.vy *= Math.pow(0.0008, dt);
      p.x = clamp(p.x + p.vx * dt, p.r + 8, state.width - p.r - 8);
      p.y = clamp(p.y + p.vy * dt, 92 + p.r, state.height - p.r - 34);
    }

    function updateItems(dt) {
      const p = state.player;

      for (let i = state.gems.length - 1; i >= 0; i -= 1) {
        const gem = state.gems[i];
        gem.life -= dt;
        gem.spin += dt * 3.2;
        if (gem.life <= 0) {
          state.gems.splice(i, 1);
        } else if (distance(p, gem) < p.r + gem.r) {
          collectGem(i);
        }
      }

      for (let i = state.shields.length - 1; i >= 0; i -= 1) {
        const shield = state.shields[i];
        shield.life -= dt;
        if (shield.life <= 0) {
          state.shields.splice(i, 1);
        } else if (distance(p, shield) < p.r + shield.r) {
          collectShield(i);
        }
      }

      for (let i = state.hazards.length - 1; i >= 0; i -= 1) {
        const hazard = state.hazards[i];
        hazard.x += hazard.vx * dt;
        hazard.y += hazard.vy * dt;
        hazard.spin += dt * 4;
        const out = hazard.x < -80 || hazard.x > state.width + 80 || hazard.y < -80 || hazard.y > state.height + 80;
        if (out) {
          state.hazards.splice(i, 1);
        } else if (distance(p, hazard) < p.r + hazard.r - 3) {
          hitHazard(i);
        }
      }
    }

    function updateParticles(dt) {
      for (let i = state.particles.length - 1; i >= 0; i -= 1) {
        const pt = state.particles[i];
        pt.life -= dt;
        pt.x += pt.vx * dt;
        pt.y += pt.vy * dt;
        pt.vy += 140 * dt;
        if (pt.life <= 0) state.particles.splice(i, 1);
      }
    }

    function draw(time) {
      ctx.save();
      const wobble = state.shake > 0 ? state.shake * 10 : 0;
      ctx.translate(rand(-wobble, wobble), rand(-wobble, wobble));
      drawBackground(time);
      drawItems(time);
      drawPlayer(time);
      drawParticles();
      ctx.restore();
    }

    function drawBackground(time) {
      ctx.clearRect(0, 0, state.width, state.height);
      ctx.fillStyle = "rgba(255,255,255,0.9)";
      for (const star of state.stars) {
        const y = (star.y + time * 0.001 * star.drift) % state.height;
        ctx.globalAlpha = star.a + Math.sin(time * 0.002 + star.x) * 0.08;
        ctx.beginPath();
        ctx.arc(star.x, y, star.r, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;

      ctx.strokeStyle = "rgba(255,255,255,0.06)";
      ctx.lineWidth = 1;
      const grid = 56;
      for (let x = (time * 0.012) % grid; x < state.width; x += grid) {
        ctx.beginPath();
        ctx.moveTo(x, 92);
        ctx.lineTo(x - 90, state.height);
        ctx.stroke();
      }
    }

    function drawGem(gem) {
      ctx.save();
      ctx.translate(gem.x, gem.y);
      ctx.rotate(gem.spin);
      ctx.shadowColor = "#ffd166";
      ctx.shadowBlur = 18;
      ctx.fillStyle = "#ffd166";
      ctx.beginPath();
      ctx.moveTo(0, -gem.r * 1.35);
      ctx.lineTo(gem.r, 0);
      ctx.lineTo(0, gem.r * 1.35);
      ctx.lineTo(-gem.r, 0);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = "rgba(255,255,255,0.7)";
      ctx.beginPath();
      ctx.arc(-gem.r * 0.25, -gem.r * 0.28, gem.r * 0.22, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    function drawHazard(hazard) {
      ctx.save();
      ctx.translate(hazard.x, hazard.y);
      ctx.rotate(hazard.spin);
      ctx.shadowColor = "#ff6b6b";
      ctx.shadowBlur = 14;
      ctx.fillStyle = "#ff6b6b";
      ctx.beginPath();
      for (let i = 0; i < 8; i += 1) {
        const r = i % 2 ? hazard.r * 0.62 : hazard.r * 1.25;
        const angle = (i / 8) * Math.PI * 2;
        ctx.lineTo(Math.cos(angle) * r, Math.sin(angle) * r);
      }
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }

    function drawShield(shield) {
      ctx.save();
      ctx.translate(shield.x, shield.y);
      ctx.shadowColor = "#64e6a5";
      ctx.shadowBlur = 18;
      ctx.strokeStyle = "#64e6a5";
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.arc(0, 0, shield.r + Math.sin(performance.now() / 130) * 2, 0, Math.PI * 2);
      ctx.stroke();
      ctx.fillStyle = "rgba(100,230,165,0.22)";
      ctx.beginPath();
      ctx.arc(0, 0, shield.r, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    function drawItems() {
      for (const gem of state.gems) drawGem(gem);
      for (const shield of state.shields) drawShield(shield);
      for (const hazard of state.hazards) drawHazard(hazard);
    }

    function drawPlayer(time) {
      const p = state.player;
      const glow = state.fever > 0 ? "#64e6a5" : "#39d0ff";
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.shadowColor = glow;
      ctx.shadowBlur = state.fever > 0 ? 28 : 18;
      ctx.fillStyle = glow;
      ctx.beginPath();
      ctx.arc(0, 0, p.r, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#f7fbff";
      ctx.beginPath();
      ctx.arc(-6, -5, 4, 0, Math.PI * 2);
      ctx.arc(7, -5, 4, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = "rgba(6,17,26,0.78)";
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(1, 3, 7 + Math.sin(time * 0.006) * 1.2, 0.15, Math.PI - 0.15);
      ctx.stroke();

      if (state.fever > 0) {
        ctx.strokeStyle = "rgba(100,230,165,0.56)";
        ctx.lineWidth = 5;
        ctx.beginPath();
        ctx.arc(0, 0, p.r + 11 + Math.sin(time * 0.014) * 3, 0, Math.PI * 2);
        ctx.stroke();
      }
      ctx.restore();
    }

    function drawParticles() {
      for (const pt of state.particles) {
        ctx.globalAlpha = clamp(pt.life / pt.max, 0, 1);
        ctx.fillStyle = pt.color;
        ctx.beginPath();
        ctx.arc(pt.x, pt.y, pt.r, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
    }

    function loop(time = 0) {
      const dt = Math.min(0.033, (time - state.lastTime) / 1000 || 0);
      state.lastTime = time;
      update(dt);
      draw(time);
      requestAnimationFrame(loop);
    }

    function setPointer(event) {
      const rect = canvas.getBoundingClientRect();
      state.pointer = {
        x: event.clientX - rect.left,
        y: event.clientY - rect.top
      };
    }

    startButton.addEventListener("click", () => reset(false));
    practiceButton.addEventListener("click", () => reset(true));
    restartButton.addEventListener("click", () => reset(false));

    window.addEventListener("resize", resize);
    window.addEventListener("keydown", (event) => {
      if (event.code === "Space" && state.mode !== "play") reset(false);
      state.keys.add(event.code);
    });
    window.addEventListener("keyup", (event) => state.keys.delete(event.code));
    canvas.addEventListener("pointerdown", (event) => {
      canvas.setPointerCapture(event.pointerId);
      setPointer(event);
    });
    canvas.addEventListener("pointermove", (event) => {
      if (event.buttons || event.pointerType === "touch") setPointer(event);
    });
    canvas.addEventListener("pointerup", () => {
      state.pointer = null;
    });
    canvas.addEventListener("pointercancel", () => {
      state.pointer = null;
    });

    resize();
    loop();
  </script>
</body>
</html>
